name: Fakturasjekk quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run legal/data regression tests
        run: node tests/regression.test.mjs
      - name: Run intake classifier tests
        run: node tests/intake.test.mjs
      - name: Run deterministic engine tests
        run: node tests/engine.test.mjs
      - name: Run controlled draft tests
        run: node tests/draft.test.mjs
      - name: Run public messaging tests
        run: node tests/content.test.mjs
