name: Fakturasjekk quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Fakturasjekk tests
        run: npm test
      - name: Diagnose registered live verification workflow
        if: startsWith(github.head_ref, 'verify/rate-limit-live-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")"
          match="$(printf '%s' "$response" | jq -c '[.workflows[] | select(.path == ".github/workflows/rate-limit-production-verification.yml") | {id,name,path,state}]')"
          echo "Registered workflow match: ${match}"
          test "$match" != '[]'
