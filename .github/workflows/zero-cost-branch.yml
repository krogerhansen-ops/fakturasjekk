name: Fakturasjekk zero-cost branch gate

on:
  push:
    branches:
      - feature/internal-pilot-flow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-cost-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify zero-cost configuration contract
        run: node tests/zero-cost-mode.test.mjs
      - name: Verify free-tier budget guard
        run: node tests/free-tier-budget.test.mjs
      - name: Run full Fakturasjekk regression suite
        run: npm test
