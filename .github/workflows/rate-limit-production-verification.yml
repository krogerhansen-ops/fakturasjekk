name: Fakturasjekk live rate-limit verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Type the dedicated Fakturasjekk production project ref'
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_PROJECT_REF: jxmkaxwflouacuboaetg

jobs:
  concurrency:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'verify/rate-limit-live-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse wrong manual project confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_project_ref }}" != "${EXPECTED_PROJECT_REF}" ]]; then
            echo 'Project confirmation does not match dedicated Fakturasjekk production project.' >&2
            exit 2
          fi

      - name: Checkout reviewed verifier
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Require Supabase Management API token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo '::error title=Live verification blocked::Repository secret SUPABASE_ACCESS_TOKEN is not configured. No production Management API query was attempted.'
            exit 2
          fi
          echo 'OK: Management API credential is present; value remains masked.'

      - name: Run 12 concurrent synthetic Management API increments
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/verify-rate-limit-management-api-live.mjs
