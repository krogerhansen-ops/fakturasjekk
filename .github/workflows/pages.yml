name: Deploy Fakturasjekk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public artifact
        run: |
          rm -rf _site
          mkdir -p _site/admin _site/engine _site/rules
          cp index.html _site/index.html
          cp motor-test.html _site/motor-test.html
          cp flow-test.html _site/flow-test.html
          cp admin/rules.html _site/admin/rules.html
          cp engine/analyzer.mjs _site/engine/analyzer.mjs
          cp engine/intake.mjs _site/engine/intake.mjs
          cp engine/draft.mjs _site/engine/draft.mjs
          cp rules/rules.json _site/rules/rules.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
