project_id = "fakturasjekk-local"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "15MiB"

# Public technical preflight only. It returns no customer data and hard-checks the dedicated project URL.
# The real Fakturasjekk API is NOT deployed by this configuration yet.
[functions.fakturasjekk-preflight]
verify_jwt = false
