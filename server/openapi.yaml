openapi: 3.1.0
info:
  title: Fakturasjekk API
  version: 0.46.0
  description: Production API contract for Fakturasjekk.no. Full check plus objection draft costs NOK 29. Payment is unlocked only by a server-verified provider webhook.
servers:
  - url: https://api.fakturasjekk.no
security:
  - bearerAuth: []
paths:
  /v1/cases:
    get:
      operationId: listCases
      summary: List brukerens saker
      responses:
        '200': { description: Mine saker }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCase
      summary: Opprett ny sak
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201': { description: Sak opprettet }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}:
    delete:
      operationId: deleteCase
      summary: Slett sak og private dokumentobjekter
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Sak slettet }
        '404': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/uploads:
    post:
      operationId: registerUploads
      summary: Valider dokumentsett og opprett tidsbegrensede private opplastingsmål
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { $ref: '#/components/schemas/FileDescriptor' }
      responses:
        '200':
          description: Dokumentreservasjoner opprettet
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  upload_targets:
                    type: array
                    items: { $ref: '#/components/schemas/UploadTarget' }
        '422': { description: Dokumentsett avvist }
  /v1/cases/{case_id}/documents/{document_id}/confirm:
    post:
      operationId: confirmDocumentUpload
      summary: Server-verifiser at reservert dokument er lastet opp og sikkerhetskontrollert
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Dokument verifisert }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/analyze:
    post:
      operationId: analyzeCase
      summary: Kjør dokumentuttrekk og kontrollmotor
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_note: { type: string, maxLength: 4000 }
                collection: { type: object, additionalProperties: true }
      responses:
        '200': { description: Forhåndsvisning eller avklaringsbehov; fullt resultat er betalingslåst }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/payment:
    get:
      operationId: getPaymentRequirement
      summary: Hent betalingskrav
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200':
          description: Betalingskrav
          content:
            application/json:
              schema:
                type: object
                required: [case_id, amount_minor, amount_nok, currency]
                properties:
                  case_id: { type: string }
                  amount_minor: { type: integer, const: 2900 }
                  amount_nok: { type: integer, const: 29 }
                  currency: { type: string, const: NOK }
  /v1/cases/{case_id}/payment/session:
    post:
      operationId: createPaymentSession
      summary: Opprett checkout hos valgt betalingsleverandør
      description: Kunden kan starte betaling, men kan ikke selv bekrefte betalingsstatus.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: Checkout opprettet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/webhooks/payment/{provider}:
    post:
      operationId: paymentWebhook
      summary: Signaturverifisert server-til-server betalingshendelse
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Verifisert hendelse behandlet }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/result:
    get:
      operationId: getFullResult
      summary: Hent fullt kundesikkert kontrollresultat
      description: Krever server-verifisert betaling på 29 kr for samme sak. Interne regel-ID-er og funnkoder eksponeres ikke.
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200': { description: Fullt resultat med funn, beregninger, bevisgrunnlag, regel-/paragrafkontroll og kontrollert utkast }
        '402': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/draft:
    post:
      operationId: createDraft
      summary: Lagre kontrollert innsigelsesutkast
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Utkast lagret }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/supplier-response:
    post:
      operationId: registerSupplierResponse
      summary: Registrer leverandørsvar og kjør Svarrunde 2
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_record, structured_response]
              properties:
                response_record: { type: object, additionalProperties: true }
                structured_response: { type: object, additionalProperties: true }
      responses:
        '201': { description: Svar gjennomgått; interne finding-koder eksponeres ikke }
  /v1/cases/{case_id}/retention:
    get:
      operationId: getRetentionStatus
      summary: Hent lagrings- og slettestatus
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200': { description: Retention- og purge-plan }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Error:
      description: Standardisert API-feil uten interne stack traces
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateCaseRequest:
      type: object
      required: [buyer_type, subject]
      properties:
        buyer_type: { type: string, enum: [consumer, business] }
        subject: { type: string, maxLength: 80 }
        retention_mode: { type: string, enum: [temporary, saved_case], default: temporary }
    FileDescriptor:
      type: object
      required: [name, mime_type, size, role]
      properties:
        name: { type: string, maxLength: 255 }
        mime_type: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 15728640 }
        role: { type: string, enum: [invoice, quote, agreement, order_confirmation, collection_notice, payment_request, other] }
    UploadTarget:
      type: object
      required: [document_id, upload_url]
      properties:
        document_id: { type: string }
        upload_url: { type: string, format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
        required_headers: { type: object, additionalProperties: { type: string } }
    PaymentSession:
      type: object
      required: [provider, checkout_url]
      properties:
        provider: { type: string }
        checkout_url: { type: string, format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { type: string }
