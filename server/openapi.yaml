openapi: 3.1.0
info:
  title: Fakturasjekk API
  version: 0.50.0
  description: API for Fakturasjekk.no. Full fakturasjekk + innsigelsesutkast costs NOK 29. Payment access is granted only after a server-verified provider webhook.
servers:
  - url: https://api.fakturasjekk.no
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness
      responses:
        '200': { description: Prosessen svarer }
  /ready:
    get:
      security: []
      summary: Production readiness without secrets
      responses:
        '200': { description: Alle nødvendige produksjonskontroller er klare }
        '503': { description: Én eller flere produksjonskontroller mangler }
  /v1/cases:
    get:
      summary: Mine saker
      responses:
        '200': { description: Sikker saksoversikt uten dokumentinnhold }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Opprett sak
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201': { description: Sak opprettet }
        '400': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}:
    delete:
      summary: Slett sak og private dokumentobjekter
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Sak slettet }
        '404': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/uploads:
    post:
      summary: Valider dokumentsett og opprett private, tidsbegrensede opplastingsmål
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { $ref: '#/components/schemas/FileDescriptor' }
      responses:
        '200':
          description: Opplastingsmål opprettet; storage_key eksponeres aldri
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  upload_targets:
                    type: array
                    items: { $ref: '#/components/schemas/UploadTarget' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/documents/{document_id}/confirm:
    post:
      summary: Server-verifiser filtype, størrelse, magic bytes og malware-status før analyse
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Dokument verifisert }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/analyze:
    post:
      summary: Kjør dokumentuttrekk og deterministisk kontrollmotor
      description: Før betaling returneres bare forhåndsvisning eller eksplisitte avklaringsbehov.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_note: { type: string, maxLength: 4000 }
                collection: { type: object, additionalProperties: true }
      responses:
        '200': { description: Forhåndsvisning eller avklaringsbehov }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/payment:
    get:
      summary: Hent betalingskrav
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200':
          description: Fast pris for saken
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount_minor: { type: integer, const: 2900 }
                  amount_nok: { type: integer, const: 29 }
                  currency: { type: string, const: NOK }
  /v1/cases/{case_id}/payment/session:
    post:
      summary: Opprett checkout hos betalingsleverandør
      description: Klienten kan starte betaling, men kan aldri bekrefte betalingsstatus selv.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: Checkout opprettet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/webhooks/payment/{provider}:
    post:
      security: []
      summary: Signaturverifisert server-til-server betalingshendelse
      description: Rå request-body bevares til leverandørens signaturkontroll. Ingen browserbekreftelse godtas.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Verifisert hendelse behandlet }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/result:
    get:
      summary: Hent fullt kundesikkert resultat
      description: Krever server-verifisert 29 kr-betaling. Interne funnkoder, regel-ID-er, storage keys og provider references eksponeres ikke.
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200': { description: Funn, beregninger, bevisgrunnlag, regel-/paragrafkontroll og kontrollert utkast }
        '402': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/draft:
    post:
      summary: Lagre kontrollert innsigelsesutkast
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Utkast lagret }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/supplier-response:
    post:
      summary: Lim inn leverandørens svar og kjør Svarrunde 2 server-side
      description: Klienten sender bare svartekst. Interne finding_code/structured_response-felt avvises.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_text]
              additionalProperties: false
              properties:
                response_text: { type: string, minLength: 1, maxLength: 20000 }
                invoice_reference: { type: string, maxLength: 200 }
      responses:
        '201': { description: Svar-dekning og eventuell oppfølging uten interne koder }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/retention:
    get:
      summary: Hent lagrings- og slettestatus
      parameters: [ { $ref: '#/components/parameters/CaseId' } ]
      responses:
        '200': { description: Retention- og purge-plan }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Error:
      description: Standardisert feil uten interne stack traces
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateCaseRequest:
      type: object
      required: [buyer_type, subject]
      properties:
        buyer_type: { type: string, enum: [consumer, business] }
        subject: { type: string, maxLength: 80 }
        retention_mode: { type: string, enum: [temporary, saved_case], default: temporary }
    FileDescriptor:
      type: object
      required: [name, mime_type, size, role]
      properties:
        name: { type: string, maxLength: 255 }
        mime_type: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 15728640 }
        role: { type: string, enum: [invoice, quote, agreement, order_confirmation, collection_notice, payment_request, other] }
    UploadTarget:
      type: object
      required: [document_id, upload_url]
      properties:
        document_id: { type: string }
        upload_url: { type: string, format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
        required_headers: { type: object, additionalProperties: { type: string } }
    PaymentSession:
      type: object
      required: [provider, checkout_url]
      properties:
        provider: { type: string }
        checkout_url: { type: string, format: uri }
        expires_at: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { type: string }
