openapi: 3.1.0
info:
  title: Fakturasjekk API
  version: 0.39.0
  description: Production API contract for Fakturasjekk.no. Full result requires verified payment of NOK 29 for the matching case.
servers:
  - url: https://api.fakturasjekk.no
security:
  - bearerAuth: []
paths:
  /v1/cases:
    post:
      operationId: createCase
      summary: Opprett ny sak
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201': { description: Sak opprettet }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/uploads:
    post:
      operationId: registerUploads
      summary: Valider og registrer dokumenter for privat opplasting
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/FileDescriptor' }
      responses:
        '200': { description: Dokumentreservasjoner opprettet }
        '422': { description: Dokumentsett avvist }
        '401': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/analyze:
    post:
      operationId: analyzeCase
      summary: Kjør dokumentuttrekk og kontrollmotor
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_note: { type: string, maxLength: 4000 }
                collection: { type: object, additionalProperties: true }
      responses:
        '200': { description: Analyse eller avklaringsbehov }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/payment:
    get:
      operationId: getPaymentRequirement
      summary: Hent betalingskrav for saken
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Betalingskrav
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount_minor: { type: integer, const: 2900 }
                  currency: { type: string, const: NOK }
  /v1/cases/{case_id}/payment/confirm:
    post:
      operationId: confirmPayment
      summary: Registrer server-verifisert betalingsbekreftelse
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  $ref: '#/components/schemas/PaymentConfirmation'
      responses:
        '200': { description: Betaling verifisert }
        '422': { description: Betaling kunne ikke verifiseres }
  /v1/cases/{case_id}/result:
    get:
      operationId: getFullResult
      summary: Hent fullt kontrollresultat
      description: Krever verifisert betaling på 29 kr for samme sak.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Fullt resultat }
        '402': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/draft:
    post:
      operationId: createDraft
      summary: Lagre kontrollert innsigelsesutkast
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Utkast lagret }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cases/{case_id}/supplier-response:
    post:
      operationId: registerSupplierResponse
      summary: Registrer leverandørsvar og kjør Svarrunde 2
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_record, structured_response]
              properties:
                response_record: { type: object, additionalProperties: true }
                structured_response: { type: object, additionalProperties: true }
      responses:
        '201': { description: Svar gjennomgått }
  /v1/cases/{case_id}/retention:
    get:
      operationId: getRetentionStatus
      summary: Hent lagrings- og slettestatus
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200': { description: Retention- og purge-plan }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Error:
      description: Standardisert API-feil uten interne stack traces
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateCaseRequest:
      type: object
      required: [buyer_type, subject]
      properties:
        buyer_type: { type: string, enum: [consumer, business] }
        subject: { type: string, maxLength: 80 }
        retention_mode: { type: string, enum: [temporary, saved_case], default: temporary }
    FileDescriptor:
      type: object
      required: [name, mime_type, size, role]
      properties:
        name: { type: string, maxLength: 255 }
        mime_type: { type: string }
        size: { type: integer, minimum: 1 }
        role: { type: string, enum: [invoice, quote, agreement, order_confirmation, correspondence, collection_notice, supplier_response, other] }
    PaymentConfirmation:
      type: object
      required: [case_id, amount_minor, currency, status, provider, provider_reference, verified_server_side]
      properties:
        case_id: { type: string }
        amount_minor: { type: integer, const: 2900 }
        currency: { type: string, const: NOK }
        status: { type: string }
        provider: { type: string }
        provider_reference: { type: string }
        verified_server_side: { type: boolean, const: true }
        paid_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { type: string }
