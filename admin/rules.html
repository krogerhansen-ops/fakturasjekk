<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fakturasjekk · Regelpanel</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f7f9fb;color:#1f2933}.wrap{max-width:1050px;margin:auto;padding:34px 20px}h1{color:#102a43;letter-spacing:-.04em}.meta{color:#64748b;margin-bottom:24px}.rule{background:white;border:1px solid #dbe3ea;border-radius:14px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:16px}.id{font:12px ui-monospace,monospace;color:#64748b}.status{font-size:12px;font-weight:800;color:#0f766e}.review{color:#a16207}.disabled{color:#b42318}.rule h2{font-size:18px;margin:6px 0;color:#102a43}.rule p{color:#64748b;line-height:1.55}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid #dbe3ea;border-radius:999px;padding:5px 8px}.rule a{color:#0b5cab;font-weight:700;font-size:13px}.banner{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px;color:#9a3412;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid #dbe3ea;border-radius:12px;padding:14px}.stat small{color:#64748b}.stat strong{display:block;font-size:24px;color:#102a43}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{display:block}}</style></head><body><div class="wrap"><h1>Regelpanel</h1><p class="meta">Intern teknisk oversikt over Fakturasjekks versjonerte regelregister.</p><div class="banner">Dette panelet godkjenner ikke juss automatisk. Hvis kildevakten feiler skal berørt regel settes til kontroll før den brukes videre.</div><div class="stats"><div class="stat"><small>Motorversjon</small><strong id="version">–</strong></div><div class="stat"><small>Aktive regler</small><strong id="active">–</strong></div><div class="stat"><small>Siste fullkontroll</small><strong id="review">–</strong></div></div><div id="rules"></div></div><script>fetch('../rules/rules.json').then(r=>r.json()).then(data=>{version.textContent=data.engine_version;review.textContent=data.last_full_review;active.textContent=data.rules.filter(r=>r.status==='active').length;rules.innerHTML=data.rules.map(r=>`<section class="rule"><div class="top"><div><div class="id">${r.id}</div><h2>${r.law} ${r.section} · ${r.title}</h2></div><div class="status ${r.status}">${r.status}</div></div><p>${r.notes}</p><div class="chips">${r.scope.map(s=>`<span class="chip">${s}</span>`).join('')}</div><p><b>Sist kontrollert:</b> ${r.last_verified}</p><a href="${r.source_url}" target="_blank" rel="noopener">Åpne Lovdata-kilde →</a></section>`).join('')}).catch(err=>{rules.innerHTML='<p>Kunne ikke laste regelregisteret: '+err.message+'</p>'})</script></body></html>
